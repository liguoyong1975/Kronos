<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能动养育语音助手 · 轻量MVP</title>
    <style>
        :root {
            --bg: #f5f7ff;
            --card: #ffffff;
            --primary: #4a67ff;
            --primary-2: #2e47d6;
            --text: #1f2a44;
            --muted: #6e7a9b;
            --line: #e8ecff;
            --ok: #21a16a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top right, #dce4ff 0%, var(--bg) 45%, #f8f9ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
        }

        .app {
            width: 100%;
            max-width: 520px;
            display: grid;
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(42, 67, 182, 0.08);
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        .sub {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .status {
            margin-top: 10px;
            font-weight: 600;
            color: var(--ok);
        }

        .btn-row {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .primary {
            background: linear-gradient(120deg, var(--primary), var(--primary-2));
            color: white;
        }

        .secondary {
            background: #eef1ff;
            color: #30408a;
        }

        .ghost {
            background: #f6f8ff;
            border: 1px solid var(--line);
            color: #445585;
        }

        .section-title {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        .tiny {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 8px;
        }

        textarea, select {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #d8e0ff;
            padding: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
        }

        textarea {
            min-height: 92px;
            resize: vertical;
        }

        .hidden {
            display: none;
        }

        .result-box {
            background: #f7f9ff;
            border: 1px dashed #c9d4ff;
            border-radius: 12px;
            padding: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.75rem;
            color: #3b4a8f;
            background: #eaf0ff;
        }
    </style>
</head>
<body>
<div class="app">
    <section class="card">
        <h1>能动养育语音助手</h1>
        <p class="sub">默认语音聆听中，直接说话即可使用</p>
        <div id="listen-status" class="status">聆听中...</div>
        <div class="btn-row">
            <button id="toggle-input" class="secondary">切换文字输入</button>
            <button id="open-settings" class="ghost">偏好设置</button>
        </div>
    </section>

    <section id="text-panel" class="card hidden">
        <h2 class="section-title">文字输入</h2>
        <p class="tiny">你可以输入：「帮我给娃布置周末作业」或「孩子考砸了我该怎么说」。</p>
        <textarea id="text-input" placeholder="请输入你的问题..."></textarea>
        <div class="btn-row">
            <button id="submit-text" class="primary">生成结果</button>
            <button id="back-voice" class="ghost">返回语音模式</button>
        </div>
    </section>

    <section id="settings-panel" class="card hidden">
        <h2 class="section-title">偏好设置</h2>
        <p class="tiny">仅保留两个默认偏好，自动记忆下次沿用。</p>
        <label class="tiny" for="input-pref">默认输入方式</label>
        <select id="input-pref">
            <option value="voice">语音</option>
            <option value="text">文字</option>
        </select>
        <div style="height:10px"></div>
        <label class="tiny" for="output-pref">默认输出方式</label>
        <select id="output-pref">
            <option value="voice">语音</option>
            <option value="text">文字</option>
        </select>
        <div class="btn-row">
            <button id="save-settings" class="primary">保存偏好</button>
            <button id="close-settings" class="ghost">关闭</button>
        </div>
    </section>

    <section class="card">
        <span id="scene-badge" class="badge">等待识别场景</span>
        <h2 class="section-title" style="margin-top:10px">结果</h2>
        <div id="result" class="result-box">开口说话后会自动识别场景并生成结果。</div>
        <div class="btn-row">
            <button id="play-result" class="primary">一键语音播放</button>
            <button id="copy-result" class="ghost">一键复制文字</button>
        </div>
    </section>
</div>

<script>
(() => {
    const storageKey = 'parenting-mvp-preferences';
    const defaultPrefs = { input: 'voice', output: 'voice' };

    const ui = {
        listenStatus: document.getElementById('listen-status'),
        toggleInputBtn: document.getElementById('toggle-input'),
        openSettingsBtn: document.getElementById('open-settings'),
        textPanel: document.getElementById('text-panel'),
        settingsPanel: document.getElementById('settings-panel'),
        textInput: document.getElementById('text-input'),
        submitTextBtn: document.getElementById('submit-text'),
        backVoiceBtn: document.getElementById('back-voice'),
        inputPref: document.getElementById('input-pref'),
        outputPref: document.getElementById('output-pref'),
        saveSettingsBtn: document.getElementById('save-settings'),
        closeSettingsBtn: document.getElementById('close-settings'),
        result: document.getElementById('result'),
        playResultBtn: document.getElementById('play-result'),
        copyResultBtn: document.getElementById('copy-result'),
        sceneBadge: document.getElementById('scene-badge')
    };

    const state = {
        prefs: loadPrefs(),
        recognition: null,
        listening: false,
        latestOutput: ''
    };

    function loadPrefs() {
        try {
            const raw = localStorage.getItem(storageKey);
            return raw ? { ...defaultPrefs, ...JSON.parse(raw) } : { ...defaultPrefs };
        } catch {
            return { ...defaultPrefs };
        }
    }

    function savePrefs() {
        localStorage.setItem(storageKey, JSON.stringify(state.prefs));
    }

    function speak(text) {
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 1;
        window.speechSynthesis.speak(utterance);
    }

    function showResult(scene, text) {
        state.latestOutput = text;
        ui.sceneBadge.textContent = `当前场景：${scene}`;
        ui.result.textContent = text;
        if (state.prefs.output === 'voice') {
            speak(text);
        }
    }

    function generateTaskAssignment(text) {
        const normalized = text.replace(/。|！|!/g, '');
        return `今天我们先完成这个任务：${normalized}。
它的意义是帮助孩子看到“现在做”会让明天更轻松。
你可以给孩子一个小选择：先做任务再吃水果，或先吃水果再开始。
我知道这件事有点枯燥，但我相信你能做到，我会陪着你。`;
    }

    function generateFeedback(text) {
        return `你可以这么说：我看到你这次已经很认真了，愿意表达自己的想法特别好。${text}这个点我们一起微调一下，你并不是做不到，而是还在练习中。我们现在一起改一小段，好吗？`;
    }

    function handleInput(rawText) {
        const text = (rawText || '').trim();
        if (!text) return;

        const isFeedback = /考砸|跑题|怎么说|怎么办|没考好|反馈/.test(text);
        const isTask = /布置|作业|任务|默写|练习|周末/.test(text);

        if (isTask && !isFeedback) {
            showResult('任务布置', generateTaskAssignment(text));
            return;
        }

        if (isFeedback) {
            showResult('反馈生成', generateFeedback(text));
            return;
        }

        showResult('反馈生成', generateFeedback(text));
    }

    function setTextMode(enabled) {
        ui.textPanel.classList.toggle('hidden', !enabled);
        ui.toggleInputBtn.textContent = enabled ? '切换语音输入' : '切换文字输入';
        state.prefs.input = enabled ? 'text' : 'voice';
        savePrefs();
        if (enabled) {
            stopListening();
            ui.listenStatus.textContent = '文字输入模式';
        } else {
            startListening();
        }
    }

    function initRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            ui.listenStatus.textContent = '当前浏览器不支持语音识别，请切换文字输入';
            return;
        }

        const recog = new SR();
        recog.lang = 'zh-CN';
        recog.interimResults = false;
        recog.continuous = true;

        recog.onresult = (event) => {
            const last = event.results[event.results.length - 1];
            const text = last[0].transcript;
            handleInput(text);
        };

        recog.onend = () => {
            if (state.listening) {
                recog.start();
            }
        };

        recog.onerror = () => {
            ui.listenStatus.textContent = '语音识别中断，可继续说话或切到文字输入';
        };

        state.recognition = recog;
    }

    function startListening() {
        if (!state.recognition) {
            initRecognition();
        }
        if (!state.recognition) return;
        if (!state.listening) {
            state.listening = true;
            state.recognition.start();
        }
        ui.listenStatus.textContent = '聆听中... 说完会自动处理';
    }

    function stopListening() {
        state.listening = false;
        if (state.recognition) {
            state.recognition.stop();
        }
    }

    ui.toggleInputBtn.addEventListener('click', () => setTextMode(state.prefs.input !== 'text'));
    ui.submitTextBtn.addEventListener('click', () => handleInput(ui.textInput.value));
    ui.backVoiceBtn.addEventListener('click', () => setTextMode(false));

    ui.openSettingsBtn.addEventListener('click', () => {
        ui.settingsPanel.classList.remove('hidden');
        ui.inputPref.value = state.prefs.input;
        ui.outputPref.value = state.prefs.output;
    });

    ui.closeSettingsBtn.addEventListener('click', () => ui.settingsPanel.classList.add('hidden'));

    ui.saveSettingsBtn.addEventListener('click', () => {
        state.prefs.input = ui.inputPref.value;
        state.prefs.output = ui.outputPref.value;
        savePrefs();
        ui.settingsPanel.classList.add('hidden');
        setTextMode(state.prefs.input === 'text');
    });

    ui.playResultBtn.addEventListener('click', () => speak(state.latestOutput || ui.result.textContent));

    ui.copyResultBtn.addEventListener('click', async () => {
        const text = state.latestOutput || ui.result.textContent;
        try {
            await navigator.clipboard.writeText(text);
            ui.copyResultBtn.textContent = '已复制';
            setTimeout(() => { ui.copyResultBtn.textContent = '一键复制文字'; }, 1000);
        } catch {
            ui.copyResultBtn.textContent = '复制失败';
            setTimeout(() => { ui.copyResultBtn.textContent = '一键复制文字'; }, 1000);
        }
    });

    ui.inputPref.value = state.prefs.input;
    ui.outputPref.value = state.prefs.output;
    setTextMode(state.prefs.input === 'text');
})();
</script>
</body>
</html>
